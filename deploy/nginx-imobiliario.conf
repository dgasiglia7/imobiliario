# /etc/nginx/sites-available/imobiliario — ver docs/DEPLOY.md, passo 4.
#
# As páginas são ESTÁTICAS: o nginx serve os arquivos direto do disco. A única
# exceção é /api/lead, que vai para o serviço do formulário em 127.0.0.1:3006
# — porta reservada em ../../infra/PORTAS.md.
#
# O domínio é gasigliaadvocacia.com.br, que hoje só redireciona para o .com.
# O site institucional WordPress continua no .com, intocado.
#
# Começa só em HTTP. O `certbot --nginx` acrescenta o HTTPS (porta 443, o
# certificado e o redirecionamento de HTTP) a estes mesmos blocos.

# Endereço principal, sem www.
server {
    listen 80;
    listen [::]:80;
    server_name gasigliaadvocacia.com.br;

    root /home/dgasiglia/imobiliario;
    index index.html;

    # O nginx roda como www-data e precisa atravessar /home/dgasiglia para
    # chegar aqui: `chmod o+x /home/dgasiglia` (passo 4). Sem isso, 403.
    location / {
        try_files $uri $uri/ =404;
    }

    # Imagens e fontes mudam só quando o arquivo muda de nome: cache longo.
    location ~* \.(jpg|jpeg|png|webp|svg|ico|woff2)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # O HTML muda a cada publicação: o navegador revalida sempre.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Nada de PHP, .git ou arquivos ocultos neste host.
    location ~ /\. {
        deny all;
    }

    # Formulário de avaliação. Caminho EXATO, não prefixo: expõe uma rota só,
    # em vez de abrir /api/ inteiro para o que vier depois.
    #
    # Ficar no mesmo domínio é o ponto do desenho: o navegador fala com o
    # próprio site, então não há CORS e nenhuma credencial de SMTP precisa
    # existir no lado do cliente. A senha fica em lead/.env, na VPS.
    location = /api/lead {
        # A zona é declarada em /etc/nginx/conf.d/, que é contexto http —
        # ver nginx-lead-ratelimit.conf. `burst=5 nodelay` atende na hora uma
        # rajada curta (recarregar a página, clicar duas vezes) e recusa o que
        # passar disso, em vez de enfileirar e segurar a conexão.
        limit_req zone=lead_por_ip burst=5 nodelay;
        limit_req_status 429;

        # O formulário cheio não passa de uns 2 KB. O serviço também corta em
        # 32 KB, mas barrar aqui evita subir o corpo até o Node à toa.
        client_max_body_size 16k;

        proxy_pass http://127.0.0.1:3006/lead;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # $remote_addr, e não $proxy_add_x_forwarded_for: o segundo ANEXA o IP
        # real ao que o visitante mandou no cabeçalho, e o serviço usa esse
        # valor para contar envios por IP — qualquer um burlaria o limite
        # inventando o próprio X-Forwarded-For. Mesma escolha do nginx-stats.conf.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # O envio inclui uma conversa SMTP com a Hostinger. O padrão de 60s do
        # nginx cortaria antes de o serviço terminar de gravar e responder.
        proxy_read_timeout 45s;
    }

    # Rastreador do Umami, servido pelo próprio domínio para ficar em primeira
    # parte, fora do alcance dos bloqueadores. O arquivo incluído mapeia
    # /stats/script.js e /stats/api/send para o contêiner em 127.0.0.1:3002,
    # o mesmo painel usado pelo Ultra Distância.
    # Ver ../../infra/UMAMI.md e ../../infra/PORTAS.md.
    include /home/dgasiglia/infra/umami/nginx-stats.conf;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 1024;
}

# Com www: redireciona para o principal, mantendo o caminho.
server {
    listen 80;
    listen [::]:80;
    server_name www.gasigliaadvocacia.com.br;

    return 301 $scheme://gasigliaadvocacia.com.br$request_uri;
}
