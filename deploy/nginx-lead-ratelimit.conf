# /etc/nginx/conf.d/imobiliario-lead-ratelimit.conf — ver docs/DEPLOY.md, passo 8.
#
# Este arquivo fica em conf.d/, e não junto do site, porque `limit_req_zone` só
# vale no contexto `http` do nginx. Dentro de um `server { … }` o nginx recusa
# a configuração inteira.
#
# A zona é a memória compartilhada onde o nginx conta as requisições por IP.
# 1 MB guarda na casa de 16 mil endereços — folga enorme para um formulário.
#
# 10r/m é generoso para gente e apertado para robô: ninguém preenche um
# formulário de dez campos seis vezes por minuto. O `burst` e o `nodelay` ficam
# no `location`, junto do caminho — ver nginx-imobiliario.conf.
limit_req_zone $binary_remote_addr zone=lead_por_ip:1m rate=10r/m;
