# /etc/nginx/snippets/imobiliario-lead.conf — instalado por instalar-nginx-lead.sh.
#
# Fica num snippet, e não solto dentro de sites-available, para que o bloco do
# site precise de UMA linha só (`include`). Assim mudar esta rota é trocar este
# arquivo e recarregar o nginx — ninguém mais edita o arquivo que o certbot
# também mexe.
#
# Formulário de avaliação. Caminho EXATO, não prefixo: expõe uma rota só, em
# vez de abrir /api/ inteiro para o que vier depois.
#
# Ficar no mesmo domínio é o ponto do desenho: o navegador fala com o próprio
# site, então não há CORS e nenhuma credencial de SMTP precisa existir no lado
# do cliente. A senha fica em lead/.env, na VPS.
location = /api/lead {
    # A zona é declarada em /etc/nginx/conf.d/, que é contexto http — ver
    # nginx-lead-ratelimit.conf. `burst=5 nodelay` atende na hora uma rajada
    # curta (recarregar a página, clicar duas vezes) e recusa o que passar
    # disso, em vez de enfileirar e segurar a conexão.
    limit_req zone=lead_por_ip burst=5 nodelay;
    limit_req_status 429;

    # O formulário cheio não passa de uns 2 KB. O serviço também corta em
    # 32 KB, mas barrar aqui evita subir o corpo até o Node à toa.
    client_max_body_size 16k;

    proxy_pass http://127.0.0.1:3006/lead;
    proxy_http_version 1.1;
    proxy_set_header Host $host;

    # $remote_addr, e não $proxy_add_x_forwarded_for: o segundo ANEXA o IP real
    # ao que o visitante mandou no cabeçalho, e o serviço usa esse valor para
    # contar envios por IP — qualquer um burlaria o limite inventando o próprio
    # X-Forwarded-For. Mesma escolha do nginx-stats.conf.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # O envio inclui uma conversa SMTP com a Hostinger. O padrão de 60s do
    # nginx cortaria antes de o serviço terminar de gravar e responder.
    proxy_read_timeout 45s;
}
