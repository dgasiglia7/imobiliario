# /etc/nginx/sites-available/imobiliario — ver docs/DEPLOY.md, passo 4.
#
# As páginas são ESTÁTICAS: o nginx serve os arquivos direto do disco. A única
# exceção é /api/lead, que vai para o serviço do formulário em 127.0.0.1:3006
# — porta reservada em ../../infra/PORTAS.md.
#
# O domínio é gasigliaadvocacia.com.br, que hoje só redireciona para o .com.
# O site institucional WordPress continua no .com, intocado.
#
# Começa só em HTTP. O `certbot --nginx` acrescenta o HTTPS (porta 443, o
# certificado e o redirecionamento de HTTP) a estes mesmos blocos.

# Endereço principal, sem www.
server {
    listen 80;
    listen [::]:80;
    server_name gasigliaadvocacia.com.br;

    root /home/dgasiglia/imobiliario;
    index index.html;

    # O nginx roda como www-data e precisa atravessar /home/dgasiglia para
    # chegar aqui: `chmod o+x /home/dgasiglia` (passo 4). Sem isso, 403.
    location / {
        try_files $uri $uri/ =404;
    }

    # Imagens e fontes mudam só quando o arquivo muda de nome: cache longo.
    location ~* \.(jpg|jpeg|png|webp|svg|ico|woff2)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # O HTML muda a cada publicação: o navegador revalida sempre.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Nada de PHP, .git ou arquivos ocultos neste host.
    location ~ /\. {
        deny all;
    }

    # Formulário de avaliação, em /api/lead. O bloco não está aqui: mora em
    # nginx-lead-location.conf, instalado como /etc/nginx/snippets/ por
    # deploy/instalar-nginx-lead.sh (passo 8.4), que também acrescenta o
    # `include` correspondente ao bloco da porta 443 deste arquivo.
    #
    # A linha NÃO entra neste modelo de propósito: no passo 4 o snippet ainda
    # não existe, e o `nginx -t` reprovaria a configuração inteira.

    # Rastreador do Umami, servido pelo próprio domínio para ficar em primeira
    # parte, fora do alcance dos bloqueadores. O arquivo incluído mapeia
    # /stats/script.js e /stats/api/send para o contêiner em 127.0.0.1:3002,
    # o mesmo painel usado pelo Ultra Distância.
    # Ver ../../infra/UMAMI.md e ../../infra/PORTAS.md.
    include /home/dgasiglia/infra/umami/nginx-stats.conf;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 1024;
}

# Com www: redireciona para o principal, mantendo o caminho.
server {
    listen 80;
    listen [::]:80;
    server_name www.gasigliaadvocacia.com.br;

    return 301 $scheme://gasigliaadvocacia.com.br$request_uri;
}
